<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JLT Race Control</title><style>
body{background:#11151e;color:#eee;font:15px system-ui;margin:24px auto;max-width:1450px;padding:0 20px}h1{color:#ffc33e}input,select,button{padding:10px;background:#27313f;color:#fff;border:1px solid #586474;border-radius:5px}button{cursor:pointer;background:#a97a12}.login{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}.login input{min-width:240px}.columns{display:grid;grid-template-columns:350px 1fr;gap:18px}.panel{background:#1a222e;padding:16px;border:1px solid #3b495a;border-radius:7px;min-width:0}#races{height:65vh;overflow:auto}.race{display:block;width:100%;text-align:left;margin:5px 0;padding:12px;background:#253143}.race.active{border-color:#ffc33e}.race small{display:block;color:#bac6d2}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{border-bottom:1px solid #445061;padding:9px;text-align:left}th{color:#ffc33e}.notice{background:#39301c;padding:12px}.selectors{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}.selectors label{display:grid;gap:4px}a{color:#ffc33e}@media(max-width:850px){.columns{grid-template-columns:1fr}#races{height:300px}}
</style><h1>JLT / RACE CONTROL</h1><p class="notice">PRIVATE PREVIEW — No race results are published. Group assignments are simulated.</p><div class="login"><input id="pass" type="password" placeholder="Admin password" aria-label="Admin password"><input id="key" type="password" placeholder="Steward racing API key" aria-label="Steward API key"><button id="load">Fetch recent races</button></div><p id="status"></p><div class="columns"><section class="panel"><h2>Race selector</h2><input id="search" type="search" placeholder="Search race ID or status" style="width:90%"><p id="count"></p><div id="races">Fetch races to begin.</div></section><section class="panel"><h2>Race results</h2><div id="details">Select a race to preview its racers and results.</div></section></div>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let races=[],groups=[],selected=null,results=[],names=new Map();
async function api(path,key=true){const headers={Authorization:'Basic '+btoa('admin:'+$('pass').value)};if(key)headers['X-Torn-Key']=$('key').value;const r=await fetch(path,{headers,cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function list(){const q=$('search').value.toLowerCase();const found=races.filter(r=>[r.id,r.status,r.title].some(x=>String(x??'').toLowerCase().includes(q)));$('count').textContent=found.length+' / '+races.length+' races';$('races').replaceChildren();for(const r of found){const b=document.createElement('button');b.className='race'+(selected===r.id?' active':'');b.innerHTML='<b>#'+esc(r.id)+'</b> · '+esc(r.status)+'<small>'+esc(r.title||'')+'</small>';b.onclick=()=>show(r.id);$('races').append(b)}}
$('search').oninput=list;
$('load').onclick=async()=>{try{$('status').textContent='Loading…';const [a,b]=await Promise.all([api('/api/races'),api('/api/groups',false)]);races=a.races;groups=b.groups;names=new Map(groups.flatMap(g=>g.drivers.map(d=>[String(d.id),d.name])));$('status').textContent=races.length+' races loaded';list()}catch(e){$('status').textContent=e.message}};
function matches(){if($('confirm'))$('confirm').disabled=true;if($('scoring'))$('scoring').textContent='Group changed. Preview points again.';const g=groups.find(g=>g.id===$('group').value),ids=new Set((g?.drivers||[]).map(d=>String(d.id)));document.querySelectorAll('[data-driver]').forEach(row=>row.querySelector('.match').textContent=ids.has(row.dataset.driver)?'MATCH':'Other group')}
function groupOptions(){const l=Number($('league').value);$('group').innerHTML=groups.filter(g=>g.league===l).map(g=>'<option value="'+esc(g.id)+'">Group '+g.group+' ('+g.drivers.length+')</option>').join('');matches()}
async function show(id){selected=id;list();$('details').textContent='Loading #'+id+'…';try{const d=await api('/api/race/'+id);if(selected!==id)return;const r=d.race;results=r.results||[];const options=Array.from({length:7},(_,i)=>'<option value="'+i+'">League '+i+'</option>').join('');$('details').innerHTML='<h3>'+esc(r.title)+'</h3><p>Race #'+esc(r.id)+' · Track '+esc(r.track_id)+' · '+esc(r.laps)+' laps · '+esc(r.status)+' · '+results.length+' racers</p><p>Creator '+esc(r.creator_id)+' · Start '+esc(r.schedule?.start)+'</p><div class="selectors"><label>League<select id="league">'+options+'</select></label><label>Group<select id="group"></select></label><label>Race slot<select id="slot">'+Array.from({length:6},(_,i)=>'<option>Qualification '+(i+1)+'</option>').join('')+'<option>Race-off 1</option><option>Race-off 2</option><option>Championship</option></select></label></div><p>Simulated groups only. Imports stay private on Oracle and are never published.</p><div class="table"><table><tr><th>Pos</th><th>Racer</th><th>Torn ID</th><th>Car</th><th>Time</th><th>Crash</th><th>Group</th></tr>'+results.slice().sort((a,b)=>a.position-b.position).map(x=>'<tr data-driver="'+esc(x.driver_id)+'"><td>'+esc(x.position)+'</td><td>'+esc(names.get(String(x.driver_id))||'Unknown racer')+'</td><td>'+esc(x.driver_id)+'</td><td>'+esc(x.car_item_name)+'</td><td>'+esc(x.race_time)+'</td><td>'+(x.has_crashed?'YES':'NO')+'</td><td class="match">—</td></tr>').join('')+'</table></div>';$('league').onchange=groupOptions;$('group').onchange=matches;$('slot').onchange=()=>{$('confirm').disabled=true;$('scoring').textContent='Race slot changed. Preview points again.'};groupOptions();$('preview').onclick=()=>score(false);$('confirm').onclick=()=>score(true)}catch(e){$('details').textContent=e.message}}

let lastPreview=null;
async function score(confirm){
 const target=confirm?$('confirm'):$('preview');target.disabled=true;
 $('scoring').textContent=confirm?'Saving private import…':'Calculating points…';
 try{
  const r=await fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Basic '+btoa('admin:'+$('pass').value),'X-Torn-Key':$('key').value},body:JSON.stringify({raceId:Number(selected),groupId:$('group').value,slot:$('slot').value,confirm})});
  const d=await r.json();if(!r.ok)throw Error(d.error||'Import failed');
  const p=d.preview;lastPreview=p;
  $('scoring').innerHTML='<h3>'+(confirm?'PRIVATE IMPORT SAVED':'POINTS PREVIEW')+'</h3><p>Group '+esc(p.groupId)+' · '+esc(p.slot)+' · '+p.matched+'/'+p.registered+' matched · '+p.outsiders+' outsiders ignored</p><div class="table"><table><tr><th>Driver</th><th>Position</th><th>Status</th><th>Points</th></tr>'+p.rows.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.position)+'</td><td>'+(x.crashed?'CRASH':x.entered?'FINISHED':'MISSED')+'</td><td>'+x.points+'</td></tr>').join('')+'</table></div><p>'+(confirm?'Saved on Oracle only. Public standings unchanged.':'Review before saving. Group assignments are SIMULATED.')+'</p>';
  $('confirm').disabled=confirm||p.matched===0;
 }catch(e){$('scoring').textContent='Error: '+e.message;if(!confirm)$('confirm').disabled=true}
 finally{$('preview').disabled=false}
}
</script></html>
