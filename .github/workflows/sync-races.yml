name: Sync approved Torn races
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
concurrency:
  group: torn-race-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch approved race IDs
        env:
          TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
        run: python scripts/sync_races.py
      - name: Commit changed raw race data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/race-index.json data/race-api-raw/
          if ! git diff --cached --quiet; then
            git commit -m "Archive Torn API race responses"
            git push
          fi
