name: Publish JLT results (test only)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and build public feed
        run: node scripts/validate-publication.mjs data/publication-draft.json
      - name: Commit test feed if changed
        run: |
          if git diff --quiet -- data/published-results.json; then
            echo "No publication changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published-results.json
          git commit -m "Publish validated empty JLT test feed"
          git push
